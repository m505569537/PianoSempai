<script>
    // Lightweight interactivity for measure counter steps
    document.addEventListener('DOMContentLoaded', () => {

      const endEl = document.getElementById('end-measure');
      
      // Interactive feedback on chips
      const chips = document.querySelectorAll('section:first-of-type .grid-cols-4 button');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => {
            c.className = 'flex items-center justify-center gap-1 py-1.5 px-2 rounded-lg bg-surface-container-low border border-outline-variant/40 text-on-surface-variant hover:text-on-surface hover:border-outline-variant text-label-md font-label-md transition-colors';
          });
          chip.className = 'flex items-center justify-center gap-1 py-1.5 px-2 rounded-lg bg-primary-container/15 border border-primary-container text-primary font-medium text-label-md font-label-md shadow-inner';
        });
      });
    });
  </script>
