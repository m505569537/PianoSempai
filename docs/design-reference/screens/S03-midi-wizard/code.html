<body class="bg-[#1C1917] text-[#F5F2ED] antialiased min-h-screen flex flex-col justify-between select-none relative overflow-x-hidden">
<!-- Main Container: Mobile Full-Bleed 390x844 architectural proportions -->
<div class="w-full max-w-[420px] mx-auto min-h-screen flex flex-col justify-between px-space-md pt-0 pb-3 relative">
<!-- TOP SECTION: Status Bar & Navigation -->
<div>

<div class="w-full h-11 flex justify-between items-center px-space-xs text-[#F5F2ED] font-title-md text-body-sm tracking-tight pt-1">
<span class="font-semibold text-[15px] pl-1 tracking-tight">9:41</span>
<div class="flex items-center gap-1.5 pr-1 text-[#F5F2ED]">
<!-- Cellular -->
<span class="material-symbols-outlined text-[16px] text-on-surface">signal_cellular_alt</span>
<!-- Wifi -->
<span class="material-symbols-outlined text-[16px] text-on-surface">wifi</span>
<!-- Battery Pill -->
<div class="w-6 h-3 rounded-[3px] border border-[#F5F2ED]/70 p-0.5 flex items-center relative ml-0.5">
<div class="w-3.5 h-full bg-[#F5F2ED] rounded-[1px]"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-[#F5F2ED]/70 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- 2. Wizard Navigation Bar -->
<div class="flex items-center justify-between py-space-sm mt-1 mb-2">
<!-- Back Button -->
<button aria-label="返回" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] active:scale-95 transition-all bg-[#262220]/60 border border-[#332D29]" type="button">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
</button>
<!-- Step Indicator (权限 -> 连接 -> 验证) -->
<div class="flex items-center gap-2">
<!-- Step 1: 权限 (Completed) -->
<div class="flex items-center gap-1.5">
<div class="w-4 h-4 rounded-full bg-[#262220] border border-[#D4A24E]/40 flex items-center justify-center text-[#D4A24E]">
<span class="material-symbols-outlined text-[11px] font-bold">check</span>
</div>
<span class="font-label-sm text-label-sm text-[#9C948B]">权限</span>
</div>
<!-- Hairline Progress Segment 1-2 -->
<div class="w-5 h-[1px] bg-[#D4A24E]/50"></div>
<!-- Step 2: 连接 (Active) -->
<div class="flex items-center gap-1.5">
<div class="relative flex items-center justify-center">
<span class="w-2.5 h-2.5 rounded-full bg-[#D4A24E]"></span>
<span class="absolute w-4 h-4 rounded-full border border-[#D4A24E]/40 animate-ping opacity-75"></span>
</div>
<span class="font-label-sm text-label-sm text-[#D4A24E] font-medium">连接</span>
</div>
<!-- Hairline Progress Segment 2-3 -->
<div class="w-5 h-[1px] bg-[#332D29]"></div>
<!-- Step 3: 验证 (Upcoming) -->
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#332D29]"></span>
<span class="font-label-sm text-label-sm text-[#9C948B]/60">验证</span>
</div>
</div>

            </button>

<div class="flex items-center justify-between py-1 opacity-60">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-[#1C1917]/50 border border-[#332D29] flex items-center justify-center text-[#9C948B]">
<span class="material-symbols-outlined text-[18px]">bluetooth_disabled</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-body-md text-[#9C948B]">未发现其他设备</span>
<span class="font-body-sm text-body-sm text-[#9C948B]/60">请确认琴已通电</span>
</div>
</div>
<button aria-label="刷新" class="w-8 h-8 rounded-lg flex items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] transition-colors" type="button">

</button>

</div>

<a class="flex items-center justify-between px-3 py-2 rounded-xl text-[#9C948B] hover:text-[#D4A24E] hover:bg-[#262220]/40 transition-all border border-transparent hover:border-[#332D29]" href="#help">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-[#9C948B]">help_outline</span>

</div>

</button>

<span class="material-symbols-outlined text-[16px]">tune</span>

</button>
<!-- Standard iOS Home Indicator Bar -->
<div class="w-32 h-1 bg-[#F5F2ED]/25 rounded-full mt-3 mb-1"></div>
</div>
