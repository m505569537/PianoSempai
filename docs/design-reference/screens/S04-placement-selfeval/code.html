<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PianoSempai - 入学评估 Step 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: '#1C1917',
            card: '#262220',
            cardBorder: '#332D29',
            amberAccent: '#D4A24E',
            amberMuted: 'rgba(212, 162, 78, 0.15)',
            textMain: '#F5F2ED',
            textMuted: '#9C948B',
            textSubtle: '#6A635B'
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #1C1917;
      color: #F5F2ED;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 380, 'GRAD' 0, 'opsz' 20;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="bg-app text-textMain flex flex-col justify-between min-h-screen selection:bg-amberAccent selection:text-app">
  <!-- Main Container full-bleed 390 max width or natural full viewport for device -->
  <div class="w-full max-w-[390px] mx-auto min-h-screen flex flex-col justify-between px-5 pt-3 pb-4">
    
    <!-- Header Section: Status Bar + Nav + Steps -->
    <div>
      <!-- iOS Status Bar -->
      <div class="w-full flex items-center justify-between text-[13px] font-semibold text-textMain tracking-tight pt-1 pb-3 px-1">
        <span>9:41</span>
        <div class="flex items-center space-x-2 text-textMain">
          <!-- Cellular -->
          <svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
            <rect x="0" y="8" width="2.5" height="4" rx="0.5"/>
            <rect x="4" y="5.5" width="2.5" height="6.5" rx="0.5"/>
            <rect x="8" y="3" width="2.5" height="9" rx="0.5"/>
            <rect x="12" y="0.5" width="2.5" height="11.5" rx="0.5"/>
          </svg>
          <!-- Wifi -->
          <svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
            <path d="M8 10.2a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8zm5.6-4.9a7.9 7.9 0 00-11.2 0 .9.9 0 01-1.3-1.3 9.7 9.7 0 0113.8 0 .9.9 0 01-1.3 1.3zm-2.8 2.8a4 4 0 00-5.6 0 .9.9 0 01-1.3-1.3 5.8 5.8 0 018.2 0 .9.9 0 01-1.3 1.3z"/>
          </svg>
          <!-- Battery -->
          <div class="flex items-center">
            <div class="w-5 h-2.5 rounded-[3px] border border-textMain/80 p-[1.5px] flex items-center">
              <div class="w-full h-full bg-textMain rounded-[1.5px]"></div>
            </div>
            <div class="w-0.5 h-1 bg-textMain/80 rounded-r-[1px] ml-[1px]"></div>
          </div>
        </div>
      </div>

      <!-- Top Navigation & Wizard Indicator -->
      <div class="flex items-center justify-between mt-1 mb-5">
        <!-- Back Chevron Button -->
        <button class="w-9 h-9 -ml-1 rounded-full flex items-center justify-center text-textMuted active:bg-card border border-transparent active:border-cardBorder transition-all" aria-label="返回">
          <span class="material-symbols-outlined text-[22px] text-textMain">chevron_left</span>
        </button>

        <!-- Step Indicator -->
        <div class="flex items-center space-x-2.5 text-xs">
          <!-- Step 1 (Active) -->
          <div class="flex items-center space-x-1.5 text-amberAccent font-medium">
            <span class="w-2 h-2 rounded-full bg-amberAccent shadow-[0_0_8px_rgba(212,162,78,0.6)]"></span>
            <span>自评</span>
          </div>

          <span class="w-3 h-[1px] bg-cardBorder"></span>

          <!-- Step 2 -->
          <div class="flex items-center space-x-1.5 text-textSubtle">
            <span class="w-1.5 h-1.5 rounded-full bg-cardBorder"></span>
            <span>三段测试</span>
          </div>

          <span class="w-3 h-[1px] bg-cardBorder"></span>

          <!-- Step 3 -->
          <div class="flex items-center space-x-1.5 text-textSubtle">
            <span class="w-1.5 h-1.5 rounded-full bg-cardBorder"></span>
            <span>校准</span>
          </div>
        </div>

        <!-- Right Pill Badge: Duration -->
        <div class="text-[11px] text-textMuted bg-card border border-cardBorder/80 px-2.5 py-1 rounded-full tracking-wide">
          约 20 分钟
        </div>
      </div>

      <!-- Title & Intro -->
      <div class="mb-5">
        <h1 class="font-serif text-[26px] leading-tight font-bold text-textMain tracking-tight mb-2">
          开始前，先了解你
        </h1>
        <p class="text-[13px] leading-relaxed text-textMuted font-normal">
          评估只用于规划你的起点，不是考试，可以随时退出。
        </p>
      </div>

      <!-- Grouped Form Card -->
      <div class="bg-card border border-cardBorder rounded-2xl overflow-hidden mb-4 shadow-sm">
        <!-- Row 1: 琴龄 -->
        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-cardBorder/20 active:bg-cardBorder/30 transition-colors cursor-pointer border-b border-cardBorder/60">
          <span class="text-[14px] text-textMain font-medium">琴龄</span>
          <div class="flex items-center space-x-1.5">
            <span class="text-[14px] text-amberAccent">约 2 年</span>
            <span class="material-symbols-outlined text-[18px] text-textSubtle">chevron_right</span>
          </div>
        </div>

        <!-- Row 2: 现有教材 -->
        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-cardBorder/20 active:bg-cardBorder/30 transition-colors cursor-pointer border-b border-cardBorder/60">
          <span class="text-[14px] text-textMain font-medium">现有教材</span>
          <div class="flex items-center space-x-1.5">
            <span class="text-[14px] text-amberAccent">拜厄 · 哈农（少量）</span>
            <span class="material-symbols-outlined text-[18px] text-textSubtle">chevron_right</span>
          </div>
        </div>

        <!-- Row 3: 每周可练次数 -->
        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-cardBorder/20 active:bg-cardBorder/30 transition-colors cursor-pointer border-b border-cardBorder/60">
          <span class="text-[14px] text-textMain font-medium">每周可练次数</span>
          <div class="flex items-center space-x-1.5">
            <span class="text-[14px] text-amberAccent">3 次</span>
            <span class="material-symbols-outlined text-[18px] text-textSubtle">chevron_right</span>
          </div>
        </div>

        <!-- Row 4: 每次时长 -->
        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-cardBorder/20 active:bg-cardBorder/30 transition-colors cursor-pointer border-b border-cardBorder/60">
          <span class="text-[14px] text-textMain font-medium">每次时长</span>
          <div class="flex items-center space-x-1.5">
            <span class="text-[14px] text-amberAccent">30 分钟（偶尔 45）</span>
            <span class="material-symbols-outlined text-[18px] text-textSubtle">chevron_right</span>
          </div>
        </div>

        <!-- Row 5: 偏好风格 -->
        <div class="flex items-center justify-between px-4 py-3.5 hover:bg-cardBorder/20 active:bg-cardBorder/30 transition-colors cursor-pointer">
          <span class="text-[14px] text-textMain font-medium">偏好风格</span>
          <div class="flex items-center space-x-1.5">
            <span class="text-[14px] text-amberAccent">古典 · 日式轻音乐</span>
            <span class="material-symbols-outlined text-[18px] text-textSubtle">chevron_right</span>
          </div>
        </div>
      </div>

      <!-- Card: 我要随身携带的曲子 -->
      <div class="bg-card border border-cardBorder rounded-2xl p-4 mb-4">
        <div class="flex items-center justify-between mb-3">
          <span class="text-[13px] font-semibold text-textMain tracking-wide flex items-center gap-1.5">
            <span class="material-symbols-outlined text-amberAccent text-[17px]">music_note</span>
            我要随身携带的曲子
          </span>
          <span class="text-[11px] text-textSubtle">目标保留曲库</span>
        </div>
        
        <!-- Chip Row -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Active Tag: Summer -->
          <div class="inline-flex items-center space-x-1.5 pl-3 pr-2 py-1.5 rounded-full border border-amberAccent/70 bg-amberAccent/10 text-amberAccent text-[13px] font-medium transition-colors">
            <span>久石让《Summer》</span>
            <button class="w-4 h-4 rounded-full flex items-center justify-center hover:bg-amberAccent/20 active:scale-90 transition-all text-amberAccent" aria-label="移除">
              <span class="material-symbols-outlined text-[14px]">close</span>
            </button>
          </div>

          <!-- Add Tag: + 添加曲目 -->
          <button class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-full border border-dashed border-cardBorder hover:border-textMuted bg-card/50 text-textMuted hover:text-textMain text-[13px] active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[15px]">add</span>
            <span>添加曲目</span>
          </button>
        </div>
      </div>

      <!-- Muted Note Card with Info Icon -->
      <div class="bg-card/60 border border-cardBorder/80 rounded-xl p-3.5 flex items-start space-x-2.5 mb-2">
        <span class="material-symbols-outlined text-amberAccent text-[19px] shrink-0 mt-0.5">info</span>
        <div class="text-[12px] leading-relaxed text-textMuted">
          <span class="text-textMain font-medium">下一步：</span>你将完成 3 个小测试——最拿手的一首、视奏陌生片段、技术探针（音阶与哈农）。
        </div>
      </div>
    </div>

    <!-- Bottom Fixed Actions & Home Indicator -->
    <div class="pt-4 pb-2 w-full flex flex-col items-center">
      <!-- Full-Width Amber CTA Button (dark text on amber fills) -->
      <button class="w-full h-13 py-3.5 px-6 rounded-full bg-amberAccent hover:bg-[#dfad56] active:scale-[0.98] text-[#1C1917] font-semibold text-[15px] tracking-wide flex items-center justify-center space-x-2 shadow-[0_4px_16px_rgba(212,162,78,0.25)] transition-all">
        <span>开始三段测试</span>
        <span class="material-symbols-outlined text-[18px] stroke-[2.5]">arrow_forward</span>
      </button>

      <!-- Ghost Secondary Link -->
      <button class="mt-3 py-1 px-3 text-[13px] text-textMuted hover:text-textMain active:opacity-75 transition-colors font-medium">
        稍后评估，先随便看看
      </button>

      <!-- iOS Home Indicator -->
      <div class="w-32 h-1 bg-textMain/25 rounded-full mt-4 mb-1"></div>
    </div>

  </div>
</body>
</html>
