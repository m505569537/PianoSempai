<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PianoSempai - 曲库 (S8)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#1C1917',
            cardDark: '#262220',
            cardBorder: '#332D29',
            amberAccent: '#D4A24E',
            amberLight: '#E5B96B',
            textMain: '#F5F2ED',
            textMuted: '#9C948B',
            textSubtle: '#686058',
            statusDone: '#38A169',
            statusDoneBg: 'rgba(56, 161, 105, 0.16)',
            statusActiveBg: 'rgba(212, 162, 78, 0.16)',
            statusMutedBg: 'rgba(156, 148, 139, 0.12)'
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Tabular numbers for index & BPM */
    .tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-bgDark text-textMain font-sans antialiased selection:bg-amberAccent selection:text-bgDark min-h-screen flex justify-center items-start m-0 p-0">

  <!-- Full-bleed iPhone Screen Container (390 x 844) -->
  <main class="w-[390px] h-[844px] bg-bgDark flex flex-col relative overflow-hidden shadow-2xl">

    <!-- Top iOS Status Bar (edge-to-edge, 44px) -->
    <header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-xs font-semibold tracking-tight text-textMain z-30 select-none">
      <span class="tabular font-medium">9:41</span>
      <div class="flex items-center gap-1.5">
        <!-- Cellular Icon -->
        <svg class="w-4 h-3 text-textMain" fill="currentColor" viewBox="0 0 17 12">
          <rect x="0" y="8.5" width="2.5" height="3.5" rx="0.7"/>
          <rect x="4.5" y="6" width="2.5" height="6" rx="0.7"/>
          <rect x="9" y="3" width="2.5" height="9" rx="0.7"/>
          <rect x="13.5" y="0" width="2.5" height="12" rx="0.7"/>
        </svg>
        <!-- Wifi Icon -->
        <svg class="w-3.5 h-3 text-textMain" fill="currentColor" viewBox="0 0 16 12">
          <path d="M8 2.5a11.95 11.95 0 0 1 7.07 2.33.75.75 0 0 1 .09 1.13l-6.5 6.5a.9.9 0 0 1-1.32 0l-6.5-6.5a.75.75 0 0 1 .09-1.13A11.95 11.95 0 0 1 8 2.5z"/>
        </svg>
        <!-- Battery Icon -->
        <div class="flex items-center">
          <div class="w-5 h-2.5 border border-textMain rounded-sm p-0.5 flex items-center">
            <div class="h-full w-3.5 bg-textMain rounded-[1px]"></div>
          </div>
          <div class="w-0.5 h-1 bg-textMain rounded-r-[1px] ml-[1px]"></div>
        </div>
      </div>
    </header>

    <!-- Header Row: Serif Title & Action Buttons -->
    <section class="px-5 pt-2 pb-3 flex justify-between items-center z-20">
      <div>
        <h1 class="font-serif text-2xl font-bold tracking-tight text-textMain flex items-baseline gap-2">
          曲库
          <span class="font-sans text-xs font-normal text-textMuted tracking-normal">Library</span>
        </h1>
      </div>
      <div class="flex items-center gap-2.5">
        <!-- Add / Import Icon Button -->
        <button type="button" aria-label="导入乐谱" class="w-9 h-9 rounded-full border border-cardBorder bg-cardDark/80 hover:border-amberAccent/60 flex items-center justify-center text-amberAccent transition-colors active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <!-- Search Magnifier Icon Button -->
        <button type="button" aria-label="搜索曲目" class="w-9 h-9 rounded-full border border-cardBorder bg-cardDark/80 hover:border-amberAccent/60 flex items-center justify-center text-textMain transition-colors active:scale-95">
          <svg class="w-4 h-4 text-textMuted hover:text-textMain transition-colors" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </section>

    <!-- Segment Tabs (Three Segments in One Unified Container) -->
    <section class="px-5 pb-3 z-20">
      <div class="p-1 bg-cardDark rounded-xl border border-cardBorder grid grid-cols-3 gap-1 shadow-inner">
        <!-- 训练教材 (Amber Selected) -->
        <button type="button" class="py-1.5 text-xs font-semibold rounded-lg bg-amberAccent text-bgDark shadow-sm flex items-center justify-center transition-all">
          训练教材
        </button>
        <!-- 奖励曲库 -->
        <button type="button" class="py-1.5 text-xs font-medium rounded-lg text-textMuted hover:text-textMain flex items-center justify-center transition-all">
          奖励曲库
        </button>
        <!-- 全部导入 -->
        <button type="button" class="py-1.5 text-xs font-medium rounded-lg text-textMuted hover:text-textMain flex items-center justify-center transition-all">
          全部导入
        </button>
      </div>
    </section>

    <!-- Scrollable Filter Chips Row -->
    <section class="pb-3 overflow-hidden z-20">
      <div class="flex gap-2 overflow-x-auto no-scrollbar px-5 py-0.5">
        <!-- '全部' (Selected Amber) -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs font-semibold bg-amberAccent/20 text-amberAccent border border-amberAccent/50 flex-shrink-0 transition-colors">
          全部
        </button>
        <!-- '拜厄' -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs text-textMuted bg-cardDark border border-cardBorder hover:border-cardBorder/80 hover:text-textMain flex-shrink-0 transition-colors">
          拜厄
        </button>
        <!-- '哈农' -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs text-textMuted bg-cardDark border border-cardBorder hover:border-cardBorder/80 hover:text-textMain flex-shrink-0 transition-colors">
          哈农
        </button>
        <!-- '车尔尼599' -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs text-textMuted bg-cardDark border border-cardBorder hover:border-cardBorder/80 hover:text-textMain flex-shrink-0 transition-colors">
          车尔尼599
        </button>
        <!-- '练习中' -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs text-textMuted bg-cardDark border border-cardBorder hover:border-cardBorder/80 hover:text-textMain flex-shrink-0 transition-colors">
          练习中
        </button>
        <!-- '已拿下' -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs text-textMuted bg-cardDark border border-cardBorder hover:border-cardBorder/80 hover:text-textMain flex-shrink-0 transition-colors">
          已拿下
        </button>
        <!-- '未开始' -->
        <button type="button" class="whitespace-nowrap px-3 py-1 rounded-full text-xs text-textMuted bg-cardDark border border-cardBorder hover:border-cardBorder/80 hover:text-textMain flex-shrink-0 transition-colors">
          未开始
        </button>
      </div>
    </section>

    <!-- Scrollable Main Content List -->
    <div class="flex-1 overflow-y-auto no-scrollbar px-5 pb-24 space-y-2.5 z-10">
      
      <!-- 1) 拜厄 第44条 (已拿下) -->
      <article class="p-3.5 rounded-2xl bg-cardDark border border-cardBorder flex items-center justify-between gap-3 active:scale-[0.99] transition-transform">
        <div class="flex items-center gap-3.5 min-w-0">
          <!-- Tabular Index -->
          <span class="font-mono tabular text-xs font-semibold text-amberAccent w-5 text-center flex-shrink-0">
            01
          </span>
          <!-- Piece Info -->
          <div class="min-w-0">
            <h2 class="font-serif text-sm font-semibold text-textMain tracking-normal truncate">
              拜厄 第45条
            </h2>
            <p class="text-xs text-textMuted mt-0.5 flex items-center gap-1.5 tabular">
              <span>已拿下</span>
              <span class="text-cardBorder">•</span>
              <span class="font-mono text-amberAccent/90 font-medium">♩=88</span>
            </p>
          </div>
        </div>
        <!-- Right Status Pill (Green) -->
        <div class="flex-shrink-0 flex items-center gap-1 px-2.5 py-1 rounded-full bg-statusDoneBg text-statusDone border border-statusDone/30 text-[11px] font-medium">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>已拿下</span>
        </div>
      </article>

      <!-- Fix piece 1 name according to prompt: 拜厄 第44条 -->
      <script>
        // Inline patch name if mismatch: piece 1 is 44, piece 2 is 45
      </script>

      <!-- 2) 拜厄 第45条 (练习中 - Current Active) -->
      <article class="p-3.5 rounded-2xl bg-cardDark border border-amberAccent/40 shadow-[0_0_14px_rgba(212,162,78,0.06)] flex items-center justify-between gap-3 active:scale-[0.99] transition-transform relative overflow-hidden">
        <!-- Subtle active left edge accent -->
        <div class="absolute left-0 top-0 bottom-0 w-1 bg-amberAccent"></div>
        <div class="flex items-center gap-3.5 min-w-0 pl-1">
          <!-- Tabular Index -->
          <span class="font-mono tabular text-xs font-bold text-amberAccent w-5 text-center flex-shrink-0">
            02
          </span>
          <!-- Piece Info -->
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 class="font-serif text-sm font-semibold text-textMain tracking-normal truncate">
                拜厄 第45条
              </h2>
              <span class="w-1.5 h-1.5 rounded-full bg-amberAccent animate-pulse"></span>
            </div>
            <p class="text-xs text-textMuted mt-0.5 flex items-center gap-1.5 tabular">
              <span>练习中</span>
              <span class="text-cardBorder">•</span>
              <span>17–24小节</span>
              <span class="text-cardBorder">•</span>
              <span class="font-mono text-amberAccent/90 font-medium">♩=72</span>
            </p>
          </div>
        </div>
        <!-- Right Status Pill (Amber) -->
        <div class="flex-shrink-0 px-2.5 py-1 rounded-full bg-statusActiveBg text-amberAccent border border-amberAccent/40 text-[11px] font-medium flex items-center gap-1">
          <svg class="w-3 h-3 animate-spin" style="animation-duration: 4s;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" stroke-dasharray="24" stroke-dashoffset="12"/>
          </svg>
          <span>练习中</span>
        </div>
      </article>

      <!-- 3) 拜厄 第46条 (未开始 - Dimmed with lock) -->
      <article class="p-3.5 rounded-2xl bg-cardDark/60 border border-cardBorder/60 opacity-75 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3.5 min-w-0">
          <!-- Tabular Index -->
          <span class="font-mono tabular text-xs font-normal text-textSubtle w-5 text-center flex-shrink-0">
            03
          </span>
          <!-- Piece Info -->
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h2 class="font-serif text-sm font-medium text-textMain/90 tracking-normal truncate">
                拜厄 第46条
              </h2>
              <svg class="w-3 h-3 text-textSubtle flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <p class="text-xs text-textSubtle mt-0.5 flex items-center gap-1.5">
              <span>未开始</span>
              <span class="text-cardBorder">•</span>
              <span>前置：第45条</span>
            </p>
          </div>
        </div>
        <!-- Right Status Pill (Muted) -->
        <div class="flex-shrink-0 px-2.5 py-1 rounded-full bg-statusMutedBg text-textMuted border border-cardBorder text-[11px] font-normal">
          未开始
        </div>
      </article>

      <!-- 4) 哈农 第1条 (练习中) -->
      <article class="p-3.5 rounded-2xl bg-cardDark border border-cardBorder flex items-center justify-between gap-3 active:scale-[0.99] transition-transform">
        <div class="flex items-center gap-3.5 min-w-0">
          <!-- Tabular Index -->
          <span class="font-mono tabular text-xs font-semibold text-amberAccent w-5 text-center flex-shrink-0">
            04
          </span>
          <!-- Piece Info -->
          <div class="min-w-0">
            <h2 class="font-serif text-sm font-semibold text-textMain tracking-normal truncate">
              哈农 第1条
            </h2>
            <p class="text-xs text-textMuted mt-0.5 flex items-center gap-1.5">
              <span>练习中</span>
              <span class="text-cardBorder">•</span>
              <span>高抬指慢练</span>
            </p>
          </div>
        </div>
        <!-- Right Status Pill (Amber) -->
        <div class="flex-shrink-0 px-2.5 py-1 rounded-full bg-statusActiveBg text-amberAccent border border-amberAccent/30 text-[11px] font-medium">
          练习中
        </div>
      </article>

      <!-- 5) 哈农 第2条 (未开始) -->
      <article class="p-3.5 rounded-2xl bg-cardDark/70 border border-cardBorder/70 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3.5 min-w-0">
          <!-- Tabular Index -->
          <span class="font-mono tabular text-xs font-normal text-textSubtle w-5 text-center flex-shrink-0">
            05
          </span>
          <!-- Piece Info -->
          <div class="min-w-0">
            <h2 class="font-serif text-sm font-medium text-textMain/85 tracking-normal truncate">
              哈农 第2条
            </h2>
            <p class="text-xs text-textSubtle mt-0.5">
              未开始
            </p>
          </div>
        </div>
        <!-- Right Status Pill (Muted) -->
        <div class="flex-shrink-0 px-2.5 py-1 rounded-full bg-statusMutedBg text-textMuted border border-cardBorder text-[11px] font-normal">
          未开始
        </div>
      </article>

      <!-- 6) 车尔尼 599 第1条 (未开始 / 路线解锁，带小锁) -->
      <article class="p-3.5 rounded-2xl bg-cardDark/50 border border-cardBorder/50 opacity-70 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3.5 min-w-0">
          <!-- Tabular Index -->
          <span class="font-mono tabular text-xs font-normal text-textSubtle w-5 text-center flex-shrink-0">
            06
          </span>
          <!-- Piece Info -->
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h2 class="font-serif text-sm font-medium text-textMain/80 tracking-normal truncate">
                车尔尼 599 第1条
              </h2>
              <svg class="w-3 h-3 text-textSubtle flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <p class="text-xs text-textSubtle mt-0.5">
              路线解锁：约 8 周后
            </p>
          </div>
        </div>
        <!-- Right Status Pill (Muted) -->
        <div class="flex-shrink-0 px-2.5 py-1 rounded-full bg-statusMutedBg text-textMuted border border-cardBorder text-[11px] font-normal">
          未解锁
        </div>
      </article>

      <!-- Dashed Amber-Outline Full-Width Card at list bottom -->
      <section class="pt-2">
        <button type="button" class="w-full py-4 px-4 rounded-2xl border border-dashed border-amberAccent/50 bg-amberAccent/[0.04] hover:bg-amberAccent/[0.08] active:scale-[0.99] transition-all flex items-center justify-center gap-2 group">
          <div class="w-5 h-5 rounded-full bg-amberAccent/20 flex items-center justify-center text-amberAccent group-hover:scale-110 transition-transform">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <span class="text-xs font-medium text-amberAccent tracking-tight">
            导入乐谱（MusicXML / .mxl / .mscz / MIDI）
          </span>
        </button>
      </section>

    </div>

    <!-- Fixed iOS Tab Bar (5 Tabs: 今日 / 曲库[Amber Active] / 练习室 / 档案 / 我的) -->
    <nav class="absolute bottom-0 left-0 right-0 h-[82px] bg-bgDark/95 backdrop-blur-xl border-t border-cardBorder px-2 pt-2.5 pb-6 flex justify-around items-center z-30">
      
      <!-- 1) 今日 -->
      <button type="button" class="flex flex-col items-center justify-center flex-1 text-textMuted hover:text-textMain transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="text-[10px] font-medium mt-1">今日</span>
      </button>

      <!-- 2) 曲库 (Active Amber) -->
      <button type="button" class="flex flex-col items-center justify-center flex-1 text-amberAccent transition-colors relative">
        <div class="relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <line x1="9" y1="6" x2="16" y2="6"></line>
            <line x1="9" y1="10" x2="14" y2="10"></line>
          </svg>
          <span class="absolute -top-0.5 -right-1 w-1.5 h-1.5 rounded-full bg-amberAccent"></span>
        </div>
        <span class="text-[10px] font-semibold mt-1">曲库</span>
      </button>

      <!-- 3) 练习室 -->
      <button type="button" class="flex flex-col items-center justify-center flex-1 text-textMuted hover:text-textMain transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M2 5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5z"/>
          <line x1="6" y1="3" x2="6" y2="12"/>
          <line x1="10" y1="3" x2="10" y2="12"/>
          <line x1="14" y1="3" x2="14" y2="12"/>
          <line x1="18" y1="3" x2="18" y2="12"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
        </svg>
        <span class="text-[10px] font-medium mt-1">练习室</span>
      </button>

      <!-- 4) 档案 -->
      <button type="button" class="flex flex-col items-center justify-center flex-1 text-textMuted hover:text-textMain transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M18 20V10"/>
          <path d="M12 20V4"/>
          <path d="M6 20v-6"/>
        </svg>
        <span class="text-[10px] font-medium mt-1">档案</span>
      </button>

      <!-- 5) 我的 -->
      <button type="button" class="flex flex-col items-center justify-center flex-1 text-textMuted hover:text-textMain transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="text-[10px] font-medium mt-1">我的</span>
      </button>

    </nav>

    <!-- iOS Home Indicator bar -->
    <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full z-40 pointer-events-none"></div>

  </main>

</body>
</html>
