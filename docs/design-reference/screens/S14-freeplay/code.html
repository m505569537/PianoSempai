<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PianoSempai - 自由弹奏 (S14)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#1C1917',
              dim: '#151311',
              bright: '#262220',
            },
            card: {
              bg: '#262220',
              border: '#332D29'
            },
            amber: {
              glow: '#D4A24E',
              muted: 'rgba(212, 162, 78, 0.25)',
              faint: 'rgba(212, 162, 78, 0.08)'
            },
            text: {
              main: '#F5F2ED',
              muted: '#9C948B',
              faint: '#655F58'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #1C1917;
      color: #F5F2ED;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-serif-sc {
      font-family: 'Noto Serif SC', serif;
    }
    .font-tabular {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    /* Pulse for MIDI Recording */
    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .recording-dot {
      animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Subtle pitch grid line */
    .piano-roll-grid {
      background-image: linear-gradient(to bottom, rgba(51, 45, 41, 0.45) 1px, transparent 1px);
      background-size: 100% 24px;
    }
  </style>
</head>
<body class="bg-[#1C1917] text-[#F5F2ED] min-h-screen flex flex-col justify-between overflow-x-hidden antialiased select-none">
  <!-- Status Bar Area -->
  <div class="w-full pt-3 px-7 flex justify-between items-center text-[13px] text-[#9C948B] font-mono tracking-tight shrink-0 z-30">
    <span class="font-semibold text-[#F5F2ED]">9:41</span>
    <div class="flex items-center gap-2 text-xs">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#D4A24E]"></span>
      <span class="text-[11px] text-[#9C948B]">MIDI 已就绪</span>
      <span class="material-symbols-outlined text-[15px] ml-1">wifi</span>
      <span class="material-symbols-outlined text-[17px]">battery_full</span>
    </div>
  </div>

  <!-- Main Screen Container (fills mobile frame 390w target) -->
  <div class="w-full max-w-[390px] mx-auto px-5 pt-3 pb-8 flex-1 flex flex-col justify-between">
    
    <!-- Top Navigation -->
    <header class="flex items-center justify-between py-2 shrink-0">
      <button class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
      </button>

      <h1 class="font-serif-sc text-xl font-medium tracking-wide text-[#F5F2ED] text-center">
        自由弹奏
      </h1>

      <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#262220] border border-[#332D29] text-[#9C948B] hover:text-[#D4A24E] hover:border-[#D4A24E]/40 active:scale-95 transition-all text-xs">
        <span class="material-symbols-outlined text-[16px]">history</span>
        <span>历史录音</span>
      </button>
    </header>

    <!-- Content Area -->
    <main class="flex-1 flex flex-col justify-center space-y-4 my-auto py-2">
      
      <!-- Piano-roll Realtime Visualization Card -->
      <section class="bg-[#262220] border border-[#332D29] rounded-2xl p-4 shadow-2xl relative overflow-hidden flex flex-col justify-between">
        <!-- Visualizer canvas simulation -->
        <div class="relative w-full h-[184px] rounded-xl bg-[#181513]/90 border border-[#332D29]/60 overflow-hidden piano-roll-grid flex flex-col justify-between p-3">
          
          <!-- Pitch helper indicators (left) -->
          <div class="absolute left-2 top-0 bottom-0 flex flex-col justify-between py-2 pointer-events-none z-10 text-[9px] font-mono text-[#655F58]">
            <span>C5</span>
            <span>G4</span>
            <span>C4</span>
            <span>F3</span>
            <span>C3</span>
          </div>

          <!-- Live fading amber note bars (Piano Roll) -->
          <div class="absolute inset-0 pl-7 pr-3 py-3 overflow-hidden pointer-events-none">
            <!-- Note bar 1: C5 fading high note -->
            <div class="absolute right-[45%] top-[22px] h-[5px] w-[58px] rounded-full bg-gradient-to-r from-[#D4A24E]/20 via-[#D4A24E]/60 to-[#D4A24E]/90 shadow-[0_0_8px_rgba(212,162,78,0.3)]"></div>
            
            <!-- Note bar 2: E4 note sustained -->
            <div class="absolute right-[65%] top-[64px] h-[6px] w-[75px] rounded-full bg-gradient-to-r from-[#D4A24E]/15 via-[#D4A24E]/50 to-[#D4A24E]/80"></div>
            
            <!-- Note bar 3: G3 sustained -->
            <div class="absolute right-[30%] top-[98px] h-[5px] w-[90px] rounded-full bg-gradient-to-r from-[#D4A24E]/25 via-[#D4A24E]/70 to-[#D4A24E] shadow-[0_0_10px_rgba(212,162,78,0.4)]"></div>

            <!-- Note bar 4: C4 recently struck -->
            <div class="absolute right-[12%] top-[86px] h-[6px] w-[50px] rounded-full bg-gradient-to-r from-[#D4A24E]/60 via-[#F5E1B5] to-[#D4A24E] shadow-[0_0_12px_rgba(212,162,78,0.6)]"></div>

            <!-- Note bar 5: Bass pedal note F2/C3 -->
            <div class="absolute right-[22%] top-[146px] h-[5px] w-[110px] rounded-full bg-gradient-to-r from-[#D4A24E]/10 via-[#D4A24E]/40 to-[#D4A24E]/70"></div>
            
            <!-- Right playhead line (subtle vertical glow) -->
            <div class="absolute right-3 top-0 bottom-0 w-[1px] bg-gradient-to-b from-transparent via-[#D4A24E]/40 to-transparent"></div>
          </div>

          <!-- Bottom subtle live feedback pill -->
          <div class="relative z-20 flex justify-between items-center w-full mt-auto pt-2 border-t border-[#332D29]/40 text-[10px] text-[#9C948B]">
            <span class="flex items-center gap-1.5 font-mono">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#D4A24E]"></span>
              力度 74 · C4 挂留
            </span>
            <span class="font-mono text-[#655F58]">44.1kHz MIDI IN</span>
          </div>
        </div>

        <!-- Muted reassurance footer note -->
        <p class="text-center text-[#9C948B] text-xs pt-3 tracking-wide flex items-center justify-center gap-1.5">
          <span>随便弹，不打分</span>
          <span class="text-[#655F58]">·</span>
          <span>音符只记录在本机</span>
        </p>
      </section>

      <!-- Compact Meter Row -->
      <section class="bg-[#262220] border border-[#332D29] rounded-xl px-4 py-3 flex items-center justify-between text-xs">
        <!-- Duration -->
        <div class="flex items-baseline gap-1.5">
          <span class="text-[#9C948B]">本次时长</span>
          <span class="font-mono font-semibold text-[#F5F2ED] text-sm font-tabular tracking-wider">12:34</span>
        </div>

        <div class="h-3 w-[1px] bg-[#332D29]"></div>

        <!-- Note count -->
        <div class="flex items-baseline gap-1.5">
          <span class="text-[#9C948B]">音符</span>
          <span class="font-mono font-semibold text-[#D4A24E] text-sm font-tabular">486</span>
        </div>

        <div class="h-3 w-[1px] bg-[#332D29]"></div>

        <!-- Status -->
        <div class="flex items-center gap-1.5 text-[11px] text-[#9C948B]">
          <span class="w-2 h-2 rounded-full bg-[#E5484D] recording-dot shadow-[0_0_6px_rgba(229,72,77,0.7)]"></span>
          <span>录制中（仅 MIDI）</span>
        </div>
      </section>

      <!-- Memo Card: 这次弹了什么 -->
      <section class="bg-[#262220] border border-[#332D29] rounded-2xl p-4 space-y-2.5">
        <div class="flex items-center justify-between">
          <h2 class="font-serif-sc text-[15px] font-semibold text-[#F5F2ED] tracking-wide">
            这次弹了什么
          </h2>
          <span class="text-[11px] text-[#9C948B] tracking-tight">随想随记</span>
        </div>
        
        <p class="text-[11px] text-[#9C948B] leading-relaxed">
          系统不会猜曲名。你可以随手记一句
        </p>

        <div class="relative mt-1">
          <input 
            type="text" 
            placeholder="例如：瞎弹了一段菊次郎的夏天" 
            class="w-full bg-[#1C1917] border border-[#332D29] rounded-xl px-3.5 py-2.5 text-xs text-[#F5F2ED] placeholder-[#655F58] focus:outline-none focus:border-[#D4A24E]/70 transition-colors"
          />
          <span class="material-symbols-outlined absolute right-3 top-2.5 text-[16px] text-[#655F58]">
            edit_note
          </span>
        </div>
      </section>

    </main>

    <!-- Bottom Controls Section -->
    <footer class="pt-3 shrink-0 flex flex-col items-center space-y-4">
      
      <!-- Transport Actions Row -->
      <div class="w-full flex items-center justify-between gap-3">
        <!-- Metronome Button -->
        <button class="flex-1 py-3 px-3 rounded-xl bg-transparent border border-[#332D29] hover:border-[#D4A24E]/50 text-[#F5F2ED] active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-xs font-medium">
          <span class="material-symbols-outlined text-[18px] text-[#D4A24E]">timer</span>
          <span>节拍器</span>
        </button>

        <!-- Large Circular Amber Outline Transport Button: 结束并保存 -->
        <button class="flex-[1.4] py-3 px-4 rounded-full bg-[#D4A24E]/10 border-2 border-[#D4A24E] text-[#D4A24E] hover:bg-[#D4A24E] hover:text-[#1C1917] active:scale-[0.97] transition-all flex items-center justify-center gap-2 shadow-[0_0_16px_rgba(212,162,78,0.18)]">
          <span class="material-symbols-outlined text-[19px]">stop_circle</span>
          <span class="font-serif-sc font-semibold text-[13px] tracking-wide">结束并保存</span>
        </button>

        <!-- Discard Text Button -->
        <button class="flex-1 py-3 px-3 rounded-xl bg-transparent hover:bg-[#262220] text-[#9C948B] hover:text-[#F5F2ED] active:scale-[0.98] transition-all text-xs text-center font-medium">
          丢弃
        </button>
      </div>

      <!-- Home indicator bar -->
      <div class="w-32 h-1 bg-[#332D29] rounded-full mt-1"></div>
    </footer>

  </div>
</body>
</html>
