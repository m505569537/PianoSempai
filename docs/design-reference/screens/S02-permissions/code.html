<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PianoSempai - 权限设置 (S2)</title>
  <!-- Google Fonts: Noto Serif SC & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#1C1917',
            cardBg: '#262220',
            cardBorder: '#332D29',
            amberAccent: '#D4A24E',
            amberHover: '#C2913E',
            greenAccent: '#7FA97C',
            textPrimary: '#F5F2ED',
            textMuted: '#9C948B',
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #1C1917;
      color: #F5F2ED;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .font-serif-sc {
      font-family: 'Noto Serif SC', serif;
    }
    /* Hide default scrollbar */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-bgDark min-h-[844px] w-[390px] mx-auto flex flex-col justify-between p-5 relative select-none antialiased box-border">

  <!-- Top Container: Status bar spacer + Navigation + Header -->
  <div class="w-full flex flex-col">
    <!-- iOS Status Bar Mock (390 width) -->
    <div class="w-full h-11 pt-1 flex items-center justify-between text-xs font-semibold text-[#F5F2ED] tracking-tight">
      <span>9:41</span>
      <div class="flex items-center space-x-1.5 opacity-90">
        <!-- Cellular Signal -->
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C3.51 16.51 3 14.33 3 12c0-4.97 4.03-9 9-9s9 4.03 9 9c0 2.33-.51 4.51-1.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zM2 20h20v2H2z" opacity="0"/>
          <rect x="2" y="16" width="3" height="5" rx="1"/>
          <rect x="7" y="12" width="3" height="9" rx="1"/>
          <rect x="12" y="8" width="3" height="13" rx="1"/>
          <rect x="17" y="4" width="3" height="17" rx="1"/>
        </svg>
        <!-- Wifi -->
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.82c3.5 0 6.69 1.41 9.02 3.69L12 18.25 2.98 11.51C5.31 9.23 8.5 7.82 12 7.82z"/>
        </svg>
        <!-- Battery -->
        <div class="w-5 h-2.5 border border-[#F5F2ED] rounded-sm p-0.5 flex items-center">
          <div class="h-full bg-[#F5F2ED] rounded-2xs w-3/4"></div>
        </div>
      </div>
    </div>

    <!-- Navigation Bar: Back Chevron -->
    <div class="w-full pt-2 pb-3 flex items-center">
      <button class="w-9 h-9 -ml-1 rounded-full flex items-center justify-center text-textMuted hover:text-textPrimary active:bg-cardBg transition-colors" aria-label="返回">
        <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
    </div>

    <!-- Screen Title & Subtitle -->
    <div class="px-0.5 pt-0.5 pb-5">
      <h1 class="font-serif-sc text-[23px] font-bold text-textPrimary leading-snug tracking-normal">
        给 Neko 准备耳朵和眼睛
      </h1>
      <p class="text-[13px] text-textMuted mt-1.5 leading-relaxed">
        所有权限都可以之后在「我的」里改。
      </p>
    </div>

    <!-- Permission Cards Stack -->
    <div class="flex flex-col space-y-3.5">

      <!-- Card 1: 蓝牙 (MIDI) -->
      <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-sm relative overflow-hidden transition-all duration-200">
        <!-- Top row: Icon glyph & Title -->
        <div class="flex items-center space-x-3 mb-2.5">
          <div class="w-8 h-8 rounded-xl bg-[#D4A24E]/15 border border-[#D4A24E]/30 flex items-center justify-center text-amberAccent flex-shrink-0">
            <!-- Bluetooth Glyph -->
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
            </svg>
          </div>
          <h2 class="text-[15px] font-semibold text-textPrimary tracking-tight">
            蓝牙（MIDI）
          </h2>
        </div>

        <!-- Body description -->
        <p class="text-[13px] text-textMuted leading-relaxed pl-0.5 pr-1 mb-3.5">
          接收特伦斯 V70 的琴键、力度和踏板信号。这是判分的唯一依据。
        </p>

        <!-- Status & Action row -->
        <div class="flex items-center justify-between pt-1 border-t border-[#332D29]/60">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-[#7FA97C]/15 text-greenAccent border border-[#7FA97C]/30 tracking-wide">
            必需
          </span>
          <button class="px-3.5 py-1.5 rounded-lg bg-amberAccent text-bgDark text-[13px] font-semibold hover:bg-amberHover active:scale-95 transition-all duration-150 shadow-sm">
            去授权
          </button>
        </div>
      </div>

      <!-- Card 2: 相机与麦克风（按需） -->
      <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-sm relative overflow-hidden transition-all duration-200">
        <!-- Top row: Icon glyph & Title -->
        <div class="flex items-center space-x-3 mb-2.5">
          <div class="w-8 h-8 rounded-xl bg-[#332D29] border border-cardBorder flex items-center justify-center text-amberAccent flex-shrink-0">
            <!-- Camera & Mic glyph -->
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zm7.25 6c0 3.03-2.47 5.5-5.5 5.5s-5.5-2.47-5.5-5.5H6c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-1.75zM19 4h-2.5l-1-1.5h-7l-1 1.5H5c-1.1 0-2 .9-2 2v2h2V6h3.12l1-1.5h5.75l1 1.5H19v2h2V6c0-1.1-.9-2-2-2z" opacity="0.95"/>
            </svg>
          </div>
          <h2 class="text-[15px] font-semibold text-textPrimary tracking-tight">
            相机与麦克风（按需）
          </h2>
        </div>

        <!-- Body description -->
        <p class="text-[13px] text-textMuted leading-relaxed pl-0.5 pr-1 mb-3.5">
          只有你主动点「录给 AI 看」时才会启动。日常练习全程不录像、不录音。
        </p>

        <!-- Status & Action row -->
        <div class="flex items-center justify-between pt-1 border-t border-[#332D29]/60">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-[#D4A24E]/15 text-amberAccent border border-[#D4A24E]/25 tracking-wide">
            仅在主动录制时
          </span>
          <button class="px-3 py-1.5 rounded-lg bg-[#2E2926] text-textMuted border border-[#3A332F] text-[13px] font-medium hover:text-textPrimary active:scale-95 transition-all duration-150">
            稍后再说
          </button>
        </div>
      </div>

      <!-- Card 3: 提醒 -->
      <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-sm relative overflow-hidden transition-all duration-200">
        <!-- Top row: Icon glyph & Title -->
        <div class="flex items-center space-x-3 mb-2.5">
          <div class="w-8 h-8 rounded-xl bg-[#332D29] border border-cardBorder flex items-center justify-center text-amberAccent flex-shrink-0">
            <!-- Notifications Bell Glyph -->
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
            </svg>
          </div>
          <h2 class="text-[15px] font-semibold text-textPrimary tracking-tight">
            提醒
          </h2>
        </div>

        <!-- Body description -->
        <p class="text-[13px] text-textMuted leading-relaxed pl-0.5 pr-1 mb-3.5">
          每周日 21:00 收一条观察与下周建议，工作日 20:30 可选提醒。
        </p>

        <!-- Status & Action row -->
        <div class="flex items-center justify-between pt-1 border-t border-[#332D29]/60">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-[#D4A24E]/15 text-amberAccent border border-[#D4A24E]/25 tracking-wide">
            可关闭
          </span>
          <button class="px-3 py-1.5 rounded-lg bg-[#2E2926] text-textPrimary border border-cardBorder text-[13px] font-medium hover:border-amberAccent/40 active:scale-95 transition-all duration-150">
            允许通知
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Container: Safety note card + CTA button + Home Indicator -->
  <div class="w-full flex flex-col pt-4 pb-2 space-y-3.5">

    <!-- Safety note card with shield glyph -->
    <div class="bg-[#201D1A] border border-[#2D2825] rounded-xl p-3 flex items-start space-x-2.5">
      <div class="w-4 h-4 mt-0.5 text-amberAccent/90 flex-shrink-0">
        <!-- Shield Glyph -->
        <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4" stroke-width="1.8"/>
        </svg>
      </div>
      <p class="text-[11.5px] leading-relaxed text-[#9C948B]/90 font-normal">
        本应用没有服务器。MIDI 与笔记只存本机；视频片段只有你确认裁切后才会发送到火山方舟分析。
      </p>
    </div>

    <!-- CTA Button: Solid amber full-width, dark text -->
    <button class="w-full h-12 rounded-xl bg-amberAccent text-bgDark text-[15px] font-bold flex items-center justify-center space-x-1.5 shadow-md hover:bg-amberHover active:scale-[0.98] transition-all duration-150">
      <span>继续：连接电钢琴</span>
      <svg class="w-4 h-4 stroke-current ml-0.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7" />
      </svg>
    </button>

    <!-- iOS Home Bar Indicator -->
    <div class="w-full flex justify-center pt-1">
      <div class="w-32 h-1 bg-[#F5F2ED]/25 rounded-full"></div>
    </div>
  </div>

</body>
</html>
