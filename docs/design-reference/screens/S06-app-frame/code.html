<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PianoSempai - 导航架构线框图</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
      background-color: #12100E;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .font-serif-sc {
      font-family: 'Noto Serif SC', serif;
    }
  </style>
</head>
<body class="p-0 sm:p-6 select-none">
  <!-- iPhone 14 / 15 Standard Device Container (390 x 844) -->
  <div class="relative w-[390px] h-[844px] bg-[#1C1917] text-[#F5F2ED] overflow-hidden flex flex-col justify-between shadow-2xl rounded-[50px] border-[8px] border-[#2A2624]">
    
    <!-- iOS Dynamic Island & Status Bar -->
    <header class="w-full pt-3 px-7 flex justify-between items-center z-30 shrink-0">
      <!-- Time -->
      <span class="text-[15px] font-semibold tracking-tight text-[#F5F2ED] ml-1">9:41</span>
      
      <!-- Dynamic Island pill dummy -->
      <div class="w-28 h-[26px] bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2.5"></div>
      
      <!-- System Status Icons -->
      <div class="flex items-center space-x-2 text-[#F5F2ED]">
        <!-- Cellular -->
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-5h3v17h-3V4z"/>
        </svg>
        <!-- Wifi -->
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3c3.77 0 7.23 1.44 9.87 3.84L12 18.78 2.13 10.84C4.77 8.44 8.23 7 12 7z"/>
        </svg>
        <!-- Battery -->
        <div class="flex items-center">
          <div class="w-[22px] h-[11px] border border-[#F5F2ED] rounded-[3px] p-[1px] flex items-center">
            <div class="h-full w-full bg-[#F5F2ED] rounded-[1.5px]"></div>
          </div>
          <div class="w-[1.5px] h-[4px] bg-[#F5F2ED] rounded-r-[1px] ml-[1px]"></div>
        </div>
      </div>
    </header>

    <!-- Top Navigation Area -->
    <div class="px-6 pt-5 pb-3 flex justify-between items-end shrink-0">
      <h1 class="font-serif-sc text-3xl font-semibold tracking-tight text-[#F5F2ED]">今日</h1>
      
      <!-- MIDI Connection Pill -->
      <div class="flex items-center space-x-1.5 px-2.5 py-1 bg-[#262220] border border-[#332D29] rounded-full shadow-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-[#D4A24E] animate-pulse"></span>
        <span class="text-[11px] font-normal text-[#9C948B] tracking-wide">已连接 · 特伦斯 V70</span>
      </div>
    </div>

    <!-- Scrollable / Main Content Area (Wireframe Placeholders Only) -->
    <main class="flex-1 px-5 py-2 flex flex-col gap-4 overflow-y-auto">
      <!-- Block 1 -->
      <div class="w-full h-32 bg-[#262220] border border-[#332D29] rounded-2xl p-2.5 flex items-center justify-center">
        <div class="w-full h-full border border-dashed border-[#3A332E] rounded-xl flex items-center justify-center bg-[#211E1C]/60">
          <span class="text-sm tracking-wider text-[#9C948B] font-medium">占位 · 本周打卡</span>
        </div>
      </div>

      <!-- Block 2 -->
      <div class="w-full h-44 bg-[#262220] border border-[#332D29] rounded-2xl p-2.5 flex items-center justify-center">
        <div class="w-full h-full border border-dashed border-[#3A332E] rounded-xl flex items-center justify-center bg-[#211E1C]/60">
          <span class="text-sm tracking-wider text-[#9C948B] font-medium">占位 · 今日任务</span>
        </div>
      </div>

      <!-- Block 3 -->
      <div class="w-full h-24 bg-[#262220] border border-[#332D29] rounded-2xl p-2.5 flex items-center justify-center">
        <div class="w-full h-full border border-dashed border-[#3A332E] rounded-xl flex items-center justify-center bg-[#211E1C]/60">
          <span class="text-sm tracking-wider text-[#9C948B] font-medium">占位 · 开始练习</span>
        </div>
      </div>
    </main>

    <!-- Floating Action Button (FAB) - Positioned 16px above the tab bar at bottom-right -->
    <div class="absolute right-5 bottom-[98px] z-40">
      <button class="w-14 h-14 rounded-full bg-[#262220] border-2 border-[#D4A24E] text-[#D4A24E] flex items-center justify-center shadow-lg active:scale-95 transition-transform" aria-label="问 Neko">
        <!-- Cat Face Line Icon -->
        <svg class="w-7 h-7 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <!-- Cat ears and head silhouette -->
          <path d="M4 10 L4 6 L8.5 8.5 C10.5 7.8 13.5 7.8 15.5 8.5 L20 6 L20 10 C21 13 20.5 17 17.5 19.5 C14.5 21.2 9.5 21.2 6.5 19.5 C3.5 17 3 13 4 10 Z"></path>
          <!-- Cat Eyes -->
          <circle cx="8.5" cy="13.5" r="0.8" fill="#D4A24E"></circle>
          <circle cx="15.5" cy="13.5" r="0.8" fill="#D4A24E"></circle>
          <!-- Cat Nose/Mouth -->
          <path d="M12 15.5 L12 16.5 C11.5 17.2 10.5 17.2 10 16.8 M12 16.5 C12.5 17.2 13.5 17.2 14 16.8"></path>
          <!-- Whiskers -->
          <line x1="5.5" y1="14" x2="2.5" y2="13.5"></line>
          <line x1="5.5" y1="15.5" x2="2.5" y2="16"></line>
          <line x1="18.5" y1="14" x2="21.5" y2="13.5"></line>
          <line x1="18.5" y1="15.5" x2="21.5" y2="16"></line>
        </svg>
      </button>
    </div>

    <!-- Bottom Tab Bar Container -->
    <nav class="w-full bg-[#211E1C]/90 backdrop-blur-md border-t border-[#332D29] pt-2 pb-7 px-3 flex flex-col justify-end z-30 shrink-0">
      <!-- 5 Tabs evenly spaced -->
      <div class="grid grid-cols-5 items-center w-full">
        
        <!-- Tab 1: 今日 (Active: Amber) -->
        <a href="javascript:void(0)" class="flex flex-col items-center justify-center text-[#D4A24E] gap-1 group">
          <!-- Calendar / Today Icon -->
          <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <circle cx="8" cy="15" r="1" fill="#D4A24E"></circle>
            <circle cx="12" cy="15" r="1" fill="#D4A24E"></circle>
            <circle cx="16" cy="15" r="1" fill="#D4A24E"></circle>
          </svg>
          <span class="text-[11px] font-medium tracking-tight">今日</span>
        </a>

        <!-- Tab 2: 曲库 (Inactive) -->
        <a href="javascript:void(0)" class="flex flex-col items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] gap-1 transition-colors">
          <!-- Music Book / Library Icon -->
          <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <path d="M12 7v5"></path>
            <circle cx="10.5" cy="12" r="1.5"></circle>
          </svg>
          <span class="text-[11px] font-normal tracking-tight">曲库</span>
        </a>

        <!-- Tab 3: 练习室 (Inactive) -->
        <a href="javascript:void(0)" class="flex flex-col items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] gap-1 transition-colors">
          <!-- Piano Keys / Practice Room Icon -->
          <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="7" y1="5" x2="7" y2="13"></line>
            <line x1="12" y1="5" x2="12" y2="13"></line>
            <line x1="17" y1="5" x2="17" y2="13"></line>
            <line x1="4.5" y1="13" x2="4.5" y2="19"></line>
            <line x1="9.5" y1="13" x2="9.5" y2="19"></line>
            <line x1="14.5" y1="13" x2="14.5" y2="19"></line>
            <line x1="19.5" y1="13" x2="19.5" y2="19"></line>
          </svg>
          <span class="text-[11px] font-normal tracking-tight">练习室</span>
        </a>

        <!-- Tab 4: 档案 (Inactive) -->
        <a href="javascript:void(0)" class="flex flex-col items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] gap-1 transition-colors">
          <!-- Stats / Archive Icon -->
          <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 20V10"></path>
            <path d="M12 20V4"></path>
            <path d="M6 20v-6"></path>
          </svg>
          <span class="text-[11px] font-normal tracking-tight">档案</span>
        </a>

        <!-- Tab 5: 我的 (Inactive) -->
        <a href="javascript:void(0)" class="flex flex-col items-center justify-center text-[#9C948B] hover:text-[#F5F2ED] gap-1 transition-colors">
          <!-- User / Profile Icon -->
          <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="text-[11px] font-normal tracking-tight">我的</span>
        </a>

      </div>

      <!-- iOS Home Indicator -->
      <div class="w-full flex justify-center mt-4">
        <div class="w-32 h-1 bg-[#F5F2ED]/30 rounded-full"></div>
      </div>
    </nav>

  </div>
</body>
</html>
