name: PianoSempai

packages:
  SheetMusic:
    url: https://github.com/jiyimeta/swift-sheet-music
    revision: 2a3a6f73977273c12a9405b56e837773e0127525
    # Spike A 选型（docs/spikes/score-rendering.md）。上游无 tag，pin 到 2026-09-18 的 HEAD。
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
    # S26 导出/恢复 zip（MIT，成熟库；Hermes M7 指令替换自研解析器。
    # 注：指令里的 URL weichol 少字母，实际仓库为 weichsel/ZIPFoundation）

options:
  bundleIdPrefix: com.eeexu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  PianoSempai:
    type: application
    platform: iOS
    sources:
      - path: PianoSempai
    dependencies:
      - package: SheetMusic
        products:
          - SheetMusicUI
          - SheetMusicLoader
          - SheetMusicCore
          - SheetMusicMIDI
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eeexu.pianosempai
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SUPPORTS_MACCATALYST: NO
    info:
      path: PianoSempai/Info.plist
      properties:
        CFBundleDisplayName: PianoSempai
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: 接收特伦斯 V70 的琴键、力度和踏板信号。这是判分的唯一依据。
        NSCameraUsageDescription: 只有你主动点「录给 AI 看」时才会启动。日常练习全程不录像、不录音。
        NSMicrophoneUsageDescription: 只有你主动点「录给 AI 看」时才会启动。日常练习全程不录像、不录音。
        # GarageBand 验证按钮仅在可用时显示（S03 spec）；无此 scheme 声明 canOpenURL 恒 false
        LSApplicationQueriesSchemes:
          - garageband

  PianoSempaiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PianoSempaiTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PianoSempai
      - package: SheetMusic
        products:
          - SheetMusicLoader
          - SheetMusicCore

schemes:
  PianoSempai:
    build:
      targets:
        PianoSempai: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PianoSempaiTests
